name: Atualizar lista M3U

on:
  # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: "0 */6 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Atualiza tambem quando a configuracao mudar
  push:
    paths:
      - "config.yml"
      - "generate.py"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-m3u
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Gerar lista M3U
        run: python generate.py --config config.yml

      - name: Commit das listas atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/*.m3u
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca na lista."
          else
            git commit -m "chore: atualiza lista M3U ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
