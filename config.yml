# ==========================================================================
# Configuracao do gerador de lista M3U para SS IPTV
# --------------------------------------------------------------------------
# Cada provedor tem um "type" (como buscar os canais) e, quando aplicavel,
# uma lista de "regions" (paises).
#
# Provedores ativos (todos com catalogo brasileiro real):
#   - Pluto TV BR -> feed 'br' dedicado. O stream e a URL HLS oficial do
#     stitcher da propria Pluto TV (boot.pluto.tv), igual ao site pluto.tv/br.
#   - Runtime.tv  -> canais lineares (FAST) oficiais, catalogo pt/BR.
#
# Se encontrar outro feed .m3u BR gratuito, use um bloco type: m3u (exemplo
# pronto no final deste arquivo).
# ==========================================================================

output_file: playlists/lista.m3u
generate_per_provider: true

# Filtros globais (valem para TODOS os provedores)
#   include: mantem apenas canais cujo nome contenha um dos termos
#   exclude: remove canais cujo nome contenha um dos termos
global_filters:
  include: []
  exclude: []

providers:
  # ---- Pluto TV Brasil (179+ canais em portugues, stream oficial) ----
  - name: Pluto TV BR
    type: pluto
    group: "Pluto TV BR"
    regions: [br]
    enabled: true
    include: []
    exclude: []

  # ---- Runtime.tv (canais lineares FAST oficiais, catalogo BR) ----
  - name: Runtime.tv
    type: runtime
    group: "Runtime.tv"
    language: pt
    country: BR
    enabled: true
    include: []
    exclude: []

  # ---- Exemplo de fonte M3U externa (desligada por padrao) ----
  # Use este modelo se encontrar um feed .m3u/.m3u8 BR de qualquer servico.
  - name: Fonte Externa BR
    type: m3u
    group: "Extra BR"
    enabled: false
    sources:
      - https://exemplo.com/minha-lista-br.m3u8
    include: []
    exclude: []
